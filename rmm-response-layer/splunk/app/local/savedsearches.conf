[rmm_gate3_host_risk_overview]
description = Current host risk from unexpired contributions with family-max aggregation and hard asset-policy caps.
disabled = 0
enableSched = 0
search = | inputlookup rmm_asset_policy.csv | eval signal_family="__baseline__", family_score=0, last_contribution=0 | fields risk_object signal_family family_score last_contribution | append [ search index=rmm_risk earliest=-30d@d latest=now | eval risk_score=tonumber(risk_score), expires_at=tonumber(expires_at) | eval valid=if(isnotnull(risk_object) AND isnotnull(signal_family) AND isnotnull(dedup_key) AND isnotnull(risk_score) AND isnotnull(expires_at),1,0) | where valid=1 AND expires_at>now() | stats max(risk_score) as family_score max(_time) as last_contribution values(signal_id) as active_signals by risk_object signal_family ] | stats sum(family_score) as current_score max(last_contribution) as last_contribution values(active_signals) as active_signals by risk_object | lookup rmm_asset_policy.csv risk_object OUTPUT asset_class action_cap policy_reason | eval asset_class=coalesce(asset_class,"unknown"), action_cap=coalesce(action_cap,"alert"), policy_reason=coalesce(policy_reason,"unknown asset fails closed") | eval score_tier=case(current_score<20,"observe",current_score<40,"enrich",current_score<70,"collect",true(),"contain-eligible") | eval score_rank=case(score_tier="observe",0,score_tier="enrich",1,score_tier="collect",2,score_tier="contain-eligible",3) | eval cap_rank=case(action_cap="alert",0,action_cap="collect",2,action_cap="contain_after_gate5",2,true(),0) | eval effective_rank=if(score_rank<cap_rank,score_rank,cap_rank) | eval effective_action=case(effective_rank=0,"alert",effective_rank=1,"enrich",effective_rank=2,"collect",effective_rank=3,"contain") | eval response_authority=case(action_cap="contain_after_gate5","collect_only_until_gate5",action_cap="collect","collect_only",action_cap="alert","alert_only",true(),"alert_only") | eval withheld_reason=if(score_rank>cap_rank,policy_reason,null()) | eval last_contribution_utc=if(last_contribution>0,strftime(last_contribution,"%Y-%m-%dT%H:%M:%SZ"),null()) | table risk_object asset_class current_score score_tier effective_action response_authority action_cap active_signals last_contribution_utc withheld_reason policy_reason | sort 0 risk_object

[rmm_gate3_risk_timeline]
description = Reconstructable event timeline for every retained RMM host-risk contribution.
disabled = 0
enableSched = 0
search = index=rmm_risk earliest=-30d@d latest=now | eval risk_score=tonumber(risk_score), expires_at=tonumber(expires_at), active=if(expires_at>now(),"active","expired") | lookup rmm_asset_policy.csv risk_object OUTPUT asset_class action_cap policy_reason | eval asset_class=coalesce(asset_class,"unknown"), action_cap=coalesce(action_cap,"alert") | eval event_time_utc=coalesce(event_time_utc,strftime(_time,"%Y-%m-%dT%H:%M:%SZ")), expires_at_utc=coalesce(expires_at_utc,strftime(expires_at,"%Y-%m-%dT%H:%M:%SZ")) | table _time event_time_utc expires_at_utc active risk_object asset_class signal_family signal_id risk_score event_id event_record_id run_id process_guid file_sha256 dedup_key evidence_uri response_authority action_state action_cap | sort 0 - _time

[rmm_gate3_model_health]
description = Gate 3 model-health report for malformed, duplicate, expired, late, and stale-feed conditions.
disabled = 0
enableSched = 0
search = index=rmm_risk earliest=-30d@d latest=now | eval expires_num=tonumber(expires_at) | eval valid=if(isnotnull(risk_object) AND isnotnull(signal_family) AND isnotnull(signal_id) AND isnotnull(dedup_key) AND isnotnull(risk_score) AND isnotnull(expires_num),1,0) | eventstats count as dedup_occurrences by dedup_key | stats count as total_contributions sum(eval(if(valid=0,1,0))) as malformed_contributions sum(eval(if(dedup_occurrences>1,1,0))) as duplicate_events sum(eval(if(expires_num<=now(),1,0))) as expired_retained sum(eval(if(_indextime>expires_num,1,0))) as arrived_after_expiry sum(eval(if(valid=1 AND expires_num>now(),1,0))) as active_contributions max(_time) as newest_risk_event | appendcols [ search index=wazuh-alerts sourcetype="wazuh:alerts" earliest=-30d@d latest=now | stats max(_time) as newest_wazuh_event ] | eval newest_risk_event_utc=strftime(newest_risk_event,"%Y-%m-%dT%H:%M:%SZ"), newest_wazuh_event_utc=strftime(newest_wazuh_event,"%Y-%m-%dT%H:%M:%SZ"), wazuh_feed_age_seconds=now()-newest_wazuh_event | eval duplicate_status=if(duplicate_events=0,"PASS","FAIL"), malformed_status=if(malformed_contributions=0,"PASS","FAIL"), feed_status=if(wazuh_feed_age_seconds<86400,"CURRENT","STALE") | table total_contributions active_contributions expired_retained arrived_after_expiry duplicate_events duplicate_status malformed_contributions malformed_status newest_risk_event_utc newest_wazuh_event_utc wazuh_feed_age_seconds feed_status
