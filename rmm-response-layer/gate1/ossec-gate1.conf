<!-- Gate 1 active response. Append as a standalone ossec_config stanza on SIEM01, then wazuh-execd -t before restart. -->
<ossec_config>
  <command>
    <name>ar-log</name>
    <executable>ar-log.cmd</executable>
    <timeout_allowed>no</timeout_allowed>
  </command>
  <active-response>
    <disabled>no</disabled>
    <command>ar-log</command>
    <location>local</location>
    <rules_id>100212</rules_id>
  </active-response>
</ossec_config>
